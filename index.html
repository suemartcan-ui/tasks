<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tasks">
<meta name="theme-color" content="#1c1c1c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Sue's Tasks</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f3;
    --card: #ffffff;
    --border: #ececea;
    --text: #1c1c1c;
    --muted: #999;
  }

  body {
    background: var(--bg);
    font-family: 'DM Sans', 'Apple SD Gothic Neo', sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
  }

  header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 20px 20px 0;
    padding-top: calc(20px + env(safe-area-inset-top));
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 620px;
    margin: 0 auto 14px;
  }

  .title-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .title-count { font-size: 24px; font-weight: 700; }
  .title-count span { color: #e07a4a; }

  .btn-add {
    background: #1c1c1c;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .add-form {
    max-width: 620px;
    margin: 0 auto 14px;
    background: #f2f1ee;
    border-radius: 14px;
    padding: 14px;
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  .add-form.open { display: flex; }

  .add-form select, .add-form input {
    border: 1px solid #ddd;
    border-radius: 9px;
    padding: 9px 12px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
    outline: none;
    width: 100%;
    -webkit-appearance: none;
  }

  .add-form-btns { display: flex; gap: 8px; }
  .btn-confirm {
    flex: 1; background: #e07a4a; color: #fff;
    border: none; border-radius: 9px; padding: 10px;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-cancel {
    flex: 1; background: #e0dfdc; color: #666;
    border: none; border-radius: 9px; padding: 10px;
    font-size: 13px; cursor: pointer; font-family: inherit;
  }

  .tabs {
    max-width: 620px;
    margin: 0 auto;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 14px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    background: #eeede9;
    color: #777;
    border: none;
    border-radius: 20px;
    padding: 5px 13px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    flex-shrink: 0;
  }
  .tab.active { background: #1c1c1c; color: #fff; }

  main {
    max-width: 620px;
    margin: 0 auto;
    padding: 20px 16px 0;
  }

  .project-group { margin-bottom: 26px; }

  .group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .group-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .group-name { font-size: 11px; font-weight: 700; color: #999; letter-spacing: 1.5px; text-transform: uppercase; }
  .group-count { font-size: 11px; color: #ccc; }

  .task-list { display: flex; flex-direction: column; gap: 7px; }

  .task-item {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    border-left-width: 3px;
    transition: opacity 0.4s, transform 0.4s, max-height 0.4s, padding 0.4s;
    max-height: 120px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .task-item.removing {
    opacity: 0;
    transform: translateX(24px) scale(0.97);
    max-height: 0;
    padding-top: 0;
    padding-bottom: 0;
    margin: 0;
    border-width: 0;
  }

  .task-circle {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid currentColor;
    flex-shrink: 0;
  }

  .task-text { font-size: 14px; color: #2a2a2a; line-height: 1.45; }

  .empty { text-align: center; color: #bbb; margin-top: 60px; font-size: 15px; }

  .summary {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 20px;
    margin-top: 8px;
  }
  .summary-label { font-size: 10px; font-weight: 700; color: #ccc; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px; }
  .summary-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .summary-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .summary-name { font-size: 13px; color: #555; flex: 1; }
  .summary-count { font-size: 13px; font-weight: 700; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <div class="title-label">Sue's Command Center</div>
      <div class="title-count">할 일 <span id="totalCount">0</span></div>
    </div>
    <button class="btn-add" onclick="toggleAdd()">+ 추가</button>
  </div>

  <div class="add-form" id="addForm">
    <select id="newProject">
      <option>Smart Can</option>
      <option>Supy</option>
      <option>Arary</option>
      <option>Treearth</option>
      <option>Meta/SNS</option>
      <option>기타</option>
    </select>
    <input type="text" id="newText" placeholder="할 일 입력..." onkeydown="if(event.key==='Enter') confirmAdd()">
    <div class="add-form-btns">
      <button class="btn-confirm" onclick="confirmAdd()">추가</button>
      <button class="btn-cancel" onclick="toggleAdd()">취소</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
</header>

<main id="main"></main>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}

const PROJECTS = ["Smart Can","Supy","Arary","Treearth","Meta/SNS","기타"];
const COLORS = {
  "Smart Can":"#e07a4a","Supy":"#4a8de0","Arary":"#d44a9e",
  "Treearth":"#3aad6e","Meta/SNS":"#7c4ae0","기타":"#999"
};

const DEFAULT_TASKS = [
  { id:1,  project:"Meta/SNS",  text:"다른 기기+모바일 데이터로 Facebook 개인 계정 생성 시도" },
  { id:2,  project:"Meta/SNS",  text:"기존 미국 Facebook 계정 이메일을 브라질 이메일로 교체" },
  { id:3,  project:"Meta/SNS",  text:"이메일 교체 후 며칠 대기 → Meta Business Suite 생성" },
  { id:4,  project:"Meta/SNS",  text:"Smart Can Instagram 비즈니스 계정 생성" },
  { id:5,  project:"Supy",      text:"ManyChat 가입 (manychat.com)" },
  { id:6,  project:"Supy",      text:"ManyChat에서 Supy Instagram 계정 연결" },
  { id:7,  project:"Supy",      text:"ManyChat DM 자동화 플로우 생성" },
  { id:8,  project:"Smart Can", text:"smartcan.com.br 사이트 마무리" },
  { id:9,  project:"Smart Can", text:"캔시머 제품 페이지 등록" },
  { id:10, project:"Smart Can", text:"Como Comprar 페이지 제작" },
  { id:11, project:"Smart Can", text:"Marketplace 등록 (ML / Shopee / Amazon BR)" },
  { id:12, project:"Treearth",  text:"treearth.com.br ↔ Smart Can 연동 설정" },
  { id:13, project:"Arary",     text:"Arary Instagram/SNS 운영 플랜 정리" },
];

let tasks = [];
let activeFilter = "전체";
let nextId = 200;

function load() {
  try {
    const s = localStorage.getItem("sue_tasks_v3");
    tasks = s ? JSON.parse(s) : JSON.parse(JSON.stringify(DEFAULT_TASKS));
  } catch { tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS)); }
}

function save() {
  localStorage.setItem("sue_tasks_v3", JSON.stringify(tasks));
}

function toggleAdd() {
  const f = document.getElementById("addForm");
  f.classList.toggle("open");
  if (f.classList.contains("open")) setTimeout(() => document.getElementById("newText").focus(), 100);
}

function confirmAdd() {
  const text = document.getElementById("newText").value.trim();
  const project = document.getElementById("newProject").value;
  if (!text) return;
  tasks.push({ id: nextId++, project, text });
  save();
  document.getElementById("newText").value = "";
  document.getElementById("addForm").classList.remove("open");
  render();
}

function completeTask(id) {
  const el = document.getElementById("task-" + id);
  if (!el) return;
  el.classList.add("removing");
  setTimeout(() => {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }, 420);
}

function setFilter(f) {
  activeFilter = f;
  render();
}

function render() {
  const filtered = activeFilter === "전체" ? tasks : tasks.filter(t => t.project === activeFilter);
  document.getElementById("totalCount").textContent = tasks.length;

  const available = ["전체", ...PROJECTS.filter(p => tasks.some(t => t.project === p))];
  document.getElementById("tabs").innerHTML = available.map(p => {
    const count = p === "전체" ? tasks.length : tasks.filter(t => t.project === p).length;
    return `<button class="tab ${activeFilter===p?'active':''}" onclick="setFilter('${p}')">${p} <span style="opacity:0.6">${count}</span></button>`;
  }).join("");

  const main = document.getElementById("main");
  const grouped = {};
  PROJECTS.forEach(p => {
    const items = filtered.filter(t => t.project === p);
    if (items.length) grouped[p] = items;
  });

  if (!Object.keys(grouped).length) {
    main.innerHTML = `<div class="empty">🎉 다 완료됐어!</div>`;
    return;
  }

  let html = "";
  for (const [project, items] of Object.entries(grouped)) {
    const color = COLORS[project];
    html += `
      <div class="project-group">
        <div class="group-header">
          <div class="group-dot" style="background:${color}"></div>
          <span class="group-name">${project}</span>
          <span class="group-count">${items.length}</span>
        </div>
        <div class="task-list">
          ${items.map(t => `
            <div class="task-item" id="task-${t.id}" style="border-left-color:${color}" onclick="completeTask(${t.id})">
              <div class="task-circle" style="color:${color}"></div>
              <span class="task-text">${t.text}</span>
            </div>
          `).join("")}
        </div>
      </div>`;
  }

  const byProject = PROJECTS.map(p => ({ name:p, count:tasks.filter(t=>t.project===p).length })).filter(x=>x.count>0);
  html += `
    <div class="summary">
      <div class="summary-label">프로젝트별</div>
      ${byProject.map(({name,count}) => `
        <div class="summary-row">
          <div class="summary-dot" style="background:${COLORS[name]}"></div>
          <span class="summary-name">${name}</span>
          <span class="summary-count" style="color:${COLORS[name]}">${count}개</span>
        </div>
      `).join("")}
    </div>`;

  main.innerHTML = html;
}

load();
render();
</script>
</body>
</html>
